<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060F">
  <title>Fast Pass · Ingressos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/fastpass.css">
  <script>
    // Splash: uma vez por sessão (use /?splash=1 para rever). Não aparece na Portaria/Admin, sem JS ou com "reduzir movimento".
    (function () {
      try {
        var force = /[?&]splash=1/.test(location.search);
        var seen = false;
        try { seen = sessionStorage.getItem('fp_splash_seen') === '1'; } catch (e) {}
        var staff = /^#\/(portaria|admin)/.test(location.hash);
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if ((force || !seen) && !staff && !reduce) document.documentElement.classList.add('splash-on');
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
  <div id="splash" class="splash" role="presentation">
    <img class="splash-logo" src="/logo-marca.png" alt="" width="180" height="134">
    <b class="splash-nome">FAST <span>PASS</span></b>
    <span class="splash-tag">Menos filas, mais vibe</span>
  </div>
  <header class="topo">
    <a class="marca" href="#/"><img src="/logo-marca.png" alt="" width="44" height="30"><b class="nome">FAST <span>PASS</span><small>Menos filas, mais vibe</small></b></a>
    <nav id="nav"></nav>
  </header>
  <main id="app" aria-live="polite"><p class="mudo">Carregando…</p></main>
  <div id="aviso" class="aviso" hidden></div>
  <script src="/splash.js"></script>
  <script src="/vendor/qrcode.js" defer></script>
  <script src="/vendor/jsQR.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
