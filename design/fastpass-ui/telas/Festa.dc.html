<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Criar festa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FF6BE6}a:hover{color:#FFA3F0}
input::placeholder{color:#8590B5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #05060F; color: #F2F6FF; font-family: 'Space Grotesk', sans-serif; padding: 16px 20px 28px 12px; display: flex; flex-direction: column">
  <a href="Painel.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F6FF">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
  </a>

  <div style="padding: 8px 8px 0 8px; display: flex; flex-direction: column; gap: 18px; flex: 1">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; text-transform: uppercase">Nova festa</h1>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fn" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA6C9">NOME</label>
      <input id="fn" type="text" placeholder="After D'Adega" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #28E0FF; background: #0D1020; color: #F2F6FF; font-family: inherit; font-size: 16px">
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="fd" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA6C9">DATA</label>
        <input id="fd" type="text" placeholder="dd/mm/aaaa" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #232A4A; background: #0D1020; color: #F2F6FF; font-family: inherit; font-size: 16px; width: 100%">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="fh" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA6C9">ABRE ÀS</label>
        <input id="fh" type="text" placeholder="00:00" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #232A4A; background: #0D1020; color: #F2F6FF; font-family: inherit; font-size: 16px; width: 100%">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fl" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA6C9">LOCAL</label>
      <input id="fl" type="text" placeholder="Os Brothers Adega · endereço" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #232A4A; background: #0D1020; color: #F2F6FF; font-family: inherit; font-size: 16px">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="fc" style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #9AA6C9">CAPACIDADE TOTAL</label>
      <input id="fc" type="text" inputmode="numeric" placeholder="Ex.: 150" style="height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #232A4A; background: #0D1020; color: #F2F6FF; font-family: inherit; font-size: 16px">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: #0D1020; border: 1px solid #232A4A">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Vendas abertas</span>
        <span style="font-size: 12px; color: #9AA6C9">Quem tem o link já consegue comprar</span>
      </div>
      <span role="img" aria-label="Ligado" style="width: 52px; height: 30px; border-radius: 15px; background: #FF2BD6; position: relative; box-shadow: 0 0 16px rgba(255,43,214,0.4)"><span style="position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 12px; background: #05060F"></span></span>
    </div>

    <div style="flex: 1"></div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px">
      <a href="Painel.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 16px; border: 1.5px solid #232A4A; color: #7FEFFF; font-weight: 700; font-size: 16px; text-decoration: none">Cancelar</a>
      <a href="Lotes.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 16px; background: #FF2BD6; color: #05060F; font-weight: 700; font-size: 17px; text-decoration: none; box-shadow: 0 0 24px rgba(255,43,214,0.45)">Salvar e definir lotes</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {

  }

</script>
</body>
</html>
