    </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="Hostess.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 16px; background: #FF2BD6; color: #05060F; font-weight: 700; font-size: 18px; text-decoration: none; box-shadow: 0 0 24px rgba(255,43,214,0.45)">Abrir portaria</a>
